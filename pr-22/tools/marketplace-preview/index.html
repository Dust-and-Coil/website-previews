cont_1b5bt_71\"><div class=\"_mini-display-img-holder_1b5bt_79\" data-ph=\"img\"><\/div><\/div><div class=\"align-items-center justify-content-center _mini-display-img-cont_1b5bt_71\"><div class=\"_mini-display-img-holder_1b5bt_79\" data-ph=\"img\"><\/div><\/div><\/div><\/div><div class=\"flex-direction-column flex-1 _info-section-cont_1b5bt_121\"><div class=\"opa-button _vendor-img-holder_1b5bt_85\" data-ph=\"vendor\"><\/div><p class=\"font-weight-700 font-size-38 color-text-black _vendor-title_1b5bt_92\">Hold It Infinite Sustain<\/p><p class=\"font-weight-400 font-size-28 color-text-black\">34.99\u20ac<\/p><div class=\"align-items-center _try-now-cont_1b5bt_96\"><div class=\" width-fit-content align-items-center justify-content-center undefined _generic-button_bmql4_1 _bordered-cont_bmql4_46\"><p class=\"_title_bmql4_17 _bordered-title_bmql4_56\">Try now<\/p><\/div><div class=\" width-fit-content align-items-center justify-content-center undefined _generic-button_bmql4_1 _filled-cont_bmql4_63\"><p class=\"_title_bmql4_17 _filled-title_bmql4_73\">Add to cart<\/p><\/div><\/div><div class=\"shopify-description flex-direction-column _description-cont_1b5bt_101\" id=\"desc\"><\/div><\/div><\/div><\/div>", "desc": "<p><em>The best-sounding freeze for bass.<\/em><\/p>\n\n<h3>Built for the Stage<\/h3>\n\n<p>Smooth &amp; natural captures on electric, fretless, and upright. Hold a note or chord beneath what you play next.<\/p>\n\n<p><a href=\"https://dustandcoil.com/plugins/hold-it/ehx-comparison\">Hear Hold It beside the EHX Deep Freeze<\/a><\/p>\n\n<p>Adjust <strong>Speed<\/strong> for quick or gradual transitions, shape the held tone with <strong>Low Cut, High Cut, and Tilt<\/strong>. Use <strong>Life<\/strong> to add natural movement without obvious chorus or repeating modulation.<\/p>\n\n<p>Hold It uses only about <strong>1% DSP<\/strong>, leaving most of Anagram's processing power available.<\/p>\n\n<h3>Use One Footswitch or Two<\/h3>\n\n<p><em>Choose the control method that fits how you play.<\/em><\/p>\n\n<p><a href=\"https://dustandcoil.com/plugins/hold-it/how-to-setup\">Watch how it works<\/a><\/p>\n\n<ul>\n  <li>\n<strong>Latch mode<\/strong> using one or two Anagram footswitches.<\/li>\n  <li>\n<strong>Momentary mode<\/strong> via MIDI: press to capture, release to clear. Tested with Morningstar MC6 and M-VAVE Chocolate+.<\/li>\n<\/ul>\n\n<p>Reviewers liked the easy setup and user experience.<\/p>\n\n<h3>Real DSP Engineering<\/h3>\n\n<p>We built out the foundation using the <strong>Electro-Harmonix Deep Freeze<\/strong> as our reference. Then we developed new DSP algorithms to mirror your bass's natural sound:<\/p>\n\n<ul>\n  <li>\n<strong>Carefully selecting samples<\/strong> that represent the true note played,<\/li>\n  <li>\n<strong>Recreating the decay<\/strong> and sustain of a bass string,<\/li>\n  <li>\n<strong>Introducing imperfections<\/strong> without the telltale fingerprint of a chorus effect (\"Life\" control),<\/li>\n  <li>\n<strong>Auto-calibrating EQ<\/strong> for every sustained note (\"Tilt\" control).<\/li>\n<\/ul>\n\n<p>As we worked, we tracked our progress on electric (fretted &amp; fretless, active &amp; passive), and upright (pizzicato and arco).<\/p>\n\n<h3>Practice Makes Permanent<\/h3>\n\n<p><em>Use your own bass as the drone.<\/em><\/p>\n\n<p>Freeze a reference pitch and play against the sustained sound through your normal rig. This makes fretless and upright intonation practice much more enjoyable.<\/p>\n\n<p><em>Be inspired to practice with corporate-approved messaging.<\/em><\/p>\n\n<p>Additionally, Hold It tracks the notes you capture, creating a live report and visualizations.<\/p>\n\n<p>Ask us anything via our website, <a href=\"https://dustandcoil.com/\">dustandcoil.com<\/a>.<\/p>\n\n<hr>\n\n<p><small><em>Electro-Harmonix, Deep Freeze, Morningstar, MC6, M-VAVE, and Chocolate+ are trademarks of their respective owners and are used solely to identify reference products. Dust &amp; Coil is not affiliated with or endorsed by any of the above.<\/em><\/small><\/p>"}, "brmb": {"chrome": "<div class=\"flex-direction-column width-100 height-fit-content align-items-center _cont_1b5bt_1\"><div class=\"width-100 justify-content-center _content-cont_1b5bt_6\"><div class=\"flex-direction-column flex-1 align-items-end _img-section-cont_1b5bt_116\"><div class=\"align-items-center justify-content-center _img-cont_1b5bt_11\"><div class=\"overflow-hidden _imgs-holder-cont_1b5bt_22\"><div class=\"position-absolute align-items-center justify-content-center width-100 height-100\" style=\"transform: translateX(0%);\"><div class=\"_img-holder_1b5bt_32\" data-ph=\"img\"><\/div><\/div><div class=\"position-absolute align-items-center justify-content-center width-100 height-100\" style=\"transform: translateX(200%);\"><div class=\"_img-holder_1b5bt_32\" data-ph=\"img\"><\/div><\/div><\/div><div class=\"_pagination-cont_1b5bt_38\"><div class=\"_pagination-dot-selected_1b5bt_57 _pagination-dot_1b5bt_48\"><\/div><div class=\"_pagination-dot_1b5bt_48\"><\/div><\/div><\/div><div class=\"_mini-display-imgs-cont_1b5bt_63\"><div class=\"align-items-center justify-content-center _mini-display-img-cont_1b5bt_71\"><div class=\"_mini-display-img-holder_1b5bt_79\" data-ph=\"img\"><\/div><\/div><div class=\"align-items-center justify-content-center _mini-display-img-cont_1b5bt_71\"><div class=\"_mini-display-img-holder_1b5bt_79\" data-ph=\"img\"><\/div><\/div><\/div><\/div><div class=\"flex-direction-column flex-1 _info-section-cont_1b5bt_121\"><div class=\"opa-button _vendor-img-holder_1b5bt_85\" data-ph=\"vendor\"><\/div><p class=\"font-weight-700 font-size-38 color-text-black _vendor-title_1b5bt_92\">Big Red Mute Button<\/p><p class=\"font-weight-400 font-size-28 color-text-black\">Free<\/p><div class=\"align-items-center _try-now-cont_1b5bt_96\"><div class=\" width-fit-content align-items-center justify-content-center undefined _generic-button_bmql4_1 _bordered-cont_bmql4_46\"><p class=\"_title_bmql4_17 _bordered-title_bmql4_56\">Add to Library<\/p><\/div><\/div><div class=\"shopify-description flex-direction-column _description-cont_1b5bt_101\" id=\"desc\"><\/div><\/div><\/div><\/div>", "desc": "<p>STOP YOUR SOUND. NOW.<\/p>\n<p>Big Red Mute Button gives Anagram an immediate, dedicated mute. Assign it to the control you already use\u2014a stomp footswitch, MIDI controller, or anything else available.<\/p>\n<p>No long press. No hidden gesture performed correctly under stage lighting while everyone waits.<\/p>\n<p>Press the big red button: your signal mutes. Press it again: your signal returns.<br>The adjustable Fade control lets you choose anything from an immediate cutoff to a smooth fade out and back in.<\/p>\n<p>KEY FEATURES<\/p>\n<ul>\n<li>\n<strong>A BIG RED BUTTON<\/strong>: Considerable research indicated that this was the correct size and color.<br><br>\n<\/li>\n<\/ul>\n<p>SILENCE, RE-ENGINEERED<br><br>At <a href=\"https://dustandcoil.com/big-red-mute-button\">Dust &amp; Coil Audio Laboratories<\/a>, we refuse to treat silence as the mere absence of sound.<\/p>\n<p>Big Red Mute Button features our proprietary Vacuum Tube Silence\u2122 technology, producing a warm nothingness suitable for stage or studio.<\/p>\n<p>Every mute is digitally hand-calibrated to deliver:<br><\/p>\n<ul>\n<li>Zero-latency silence<br>\n<\/li>\n<li>Audiophile-approved nothingness<\/li>\n<\/ul>\n<p><br>Independent testing confirms that when Big Red Mute Button is engaged, it is extremely difficult to hear.<\/p>"}, "css": "*{box-sizing:border-box;margin:0;padding:0;border:0;font-size:100%;font:inherit;vertical-align:baseline;flex-shrink:0}\nbody{width:100vw;height:100vh;background-color:var(--anagram-gray-100);overflow-x:hidden}\n#root{width:100%;height:100%}\ndiv{display:flex;flex-flow:row;background-color:transparent}\na{display:flex;flex-flow:row;background-color:transparent;width:fit-content;height:fit-content;text-decoration:none}\n@font-face{font-family:Inter;src <script>
const D=JSON.parse(document.getElementById('data').textContent);
D.css=D.css.replaceAll('__FONTS__',new URL('/website-previews/pr-22/assets/fonts/anagram/',location.href).href);
const $=id=>document.getElementById(id);
const key=p=>'anagram-preview:'+p;
const page=p=>`<!doctype html><html><head><meta charset="utf-8"><base target="_blank"><style>${D.css}
[data-ph]{background:#e6e6e6 repeating-linear-gradient(45deg,transparent 0 12px,#ddd 12px 24px)}
[data-ph=img]{width:100%;height:100%}
[data-ph=vendor]{width:120px;height:40px}
body{height:auto;overflow:visible;background:#fff}</style></head><body><div id="root">${D[p].chrome}</div></body></html>`;
let ready='';
function render(){
  const p=$('product').value,w=+$('width').value,f=$('view');
  if(ready!==p+w){f.srcdoc=page(p);f.style.width=w+'px';ready=p+w;f.onload=fill;return}
  fill();
}
function fill(){
  const f=$('view'),doc=f.contentDocument;if(!doc||!doc.getElementById('desc'))return;
  doc.getElementById('desc').innerHTML=$('src').value;
  const s=Math.min(1,$('wrap').clientWidth/+$('width').value);
  f.style.transform=`scale(${s})`;f.style.height=doc.documentElement.scrollHeight+'px';
  $('wrap').style.height='';f.parentElement.style.minHeight=doc.documentElement.scrollHeight*s+'px';
}
function load(){const p=$('product').value;$('src').value=localStorage.getItem(key(p))??D[p].desc;render()}
$('src').oninput=()=>{localStorage.setItem(key($('product').value),$('src').value);fill()};
$('product').onchange=load;$('width').onchange=render;window.onresize=fill;
$('reset').onclick=()=>{localStorage.removeItem(key($('product').value));load()};
load();
</script>
